[project]
name = "taskplanner"
version = "1.1.0"
description = "Output-based productivity tracker for Windows: par times, automatic progress, gamified scoring."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Chaitanya Uppalapati" }]
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
dependencies = ["PySide6-Essentials>=6.7,<7"]

[project.scripts]
taskplanner = "taskplanner.app:main"

[project.gui-scripts]
taskplanner-gui = "taskplanner.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["taskplanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP042"]
