name: Test & build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: ruff check taskplanner tests
      - run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Rebuild PyInstaller bootloader from source
        # The prebuilt bootloader is shared with countless other programs (including
        # malware), so antivirus engines often flag it. A locally compiled one is unique.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --force-reinstall --no-deps --no-binary pyinstaller pyinstaller==6.22.2
      - name: Build app with PyInstaller
        run: pyinstaller packaging/taskplanner.spec --noconfirm
      - name: Smoke-test the frozen exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TaskPlanner\TaskPlanner.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe failed: $($p.ExitCode)" }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path taskplanner\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version packaging\installer.iss
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\TaskPlannerSetup-*.exe, dist\TaskPlanner\TaskPlanner.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Tee-Object -FilePath dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TaskPlannerSetup
          path: |
            dist/TaskPlannerSetup-*.exe
            dist/SHA256SUMS.txt
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path taskplanner\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          git fetch --tags --quiet
          if (git tag --list "v$v") { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
      - name: Publish release (picked up by in-app updates)
        # A new release is published whenever the version in taskplanner/__init__.py changes.
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Task Planner ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG_LATEST.md
          make_latest: true
          files: |
            dist/TaskPlannerSetup-*.exe
            dist/SHA256SUMS.txt
